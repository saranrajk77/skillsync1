<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SkillSync AI — Login</title><style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(124,92,255,.28),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(32,217,197,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(124,92,255,.06),
            transparent 45%
        ),
        #070b14;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* ================= BACKGROUND ================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
}

.orb.one {
    width: 260px;
    height: 260px;
    background: #7c5cff;
    top: -100px;
    left: -80px;
}

.orb.two {
    width: 240px;
    height: 240px;
    background: #20d9c5;
    bottom: -100px;
    right: -80px;
}


/* ================= CONTAINER ================= */

.container {

    position: relative;

    width: min(440px, 92%);

    padding: 36px;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(17,27,45,.96),
            rgba(8,13,24,.96)
        );

    border: 1px solid rgba(255,255,255,.10);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        0 0 50px rgba(124,92,255,.08);

    backdrop-filter: blur(25px);

    animation: appear .5s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(15px) scale(.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* ================= LOGO ================= */

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icon {

    width: 58px;
    height: 58px;

    margin: 0 auto 13px;

    display: grid;
    place-items: center;

    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #20d9c5
        );

    font-size: 27px;
    font-weight: 900;

    box-shadow:
        0 12px 35px rgba(124,92,255,.35);
}

.logo h1 {

    font-size: 27px;

    letter-spacing: -.7px;
}

.logo span {
    color: #20d9c5;
}

.logo p {

    margin-top: 8px;

    color: #8d9ab0;

    font-size: 13px;
}


/* ================= HEADINGS ================= */

h2 {

    margin-bottom: 21px;

    font-size: 21px;

    letter-spacing: -.4px;
}


/* ================= FORM ================= */

.form-group {
    margin-bottom: 16px;
}

label {

    display: block;

    margin-bottom: 7px;

    color: #b8c1d1;

    font-size: 13px;

    font-weight: 600;
}

.input-wrapper {
    position: relative;
}

input {

    width: 100%;

    height: 50px;

    padding:
        0 14px;

    border-radius: 11px;

    border:
        1px solid rgba(255,255,255,.10);

    background: #0a1120;

    color: white;

    outline: none;

    font-size: 14px;

    transition: .2s;
}

input::placeholder {
    color: #59667b;
}

input:focus {

    border-color: #7c5cff;

    box-shadow:
        0 0 0 3px rgba(124,92,255,.10);
}


/* ================= BUTTON ================= */

button {

    width: 100%;

    height: 50px;

    border: none;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #5f45df
        );

    color: white;

    font-weight: 750;

    font-size: 14px;

    cursor: pointer;

    margin-top: 7px;

    transition: .2s;

    box-shadow:
        0 12px 30px rgba(124,92,255,.22);
}

button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 15px 35px rgba(124,92,255,.30);
}

button:active {
    transform: translateY(0);
}


/* ================= SWITCH ================= */

.switch {

    text-align: center;

    margin-top: 21px;

    color: #8d9ab0;

    font-size: 13px;
}

.switch span {

    color: #20d9c5;

    cursor: pointer;

    font-weight: 700;
}

.switch span:hover {
    text-decoration: underline;
}


/* ================= MESSAGE ================= */

.message {

    margin-top: 16px;

    text-align: center;

    font-size: 13px;

    min-height: 18px;

    line-height: 1.4;
}


/* ================= USER PREVIEW ================= */

.user-preview {

    display: none;

    margin-top: 12px;

    padding: 12px 14px;

    border-radius: 10px;

    background: rgba(32,217,197,.07);

    border:
        1px solid rgba(32,217,197,.16);

    color: #8dece2;

    font-size: 12px;
}


/* ================= DEMO NOTE ================= */

.demo-note {

    margin-top: 24px;

    padding-top: 17px;

    border-top:
        1px solid rgba(255,255,255,.07);

    text-align: center;

    color: #59667b;

    font-size: 11px;

    line-height: 1.5;
}


/* ================= HIDDEN ================= */

.hidden {
    display: none !important;
}


/* ================= MOBILE ================= */

@media(max-width: 500px) {

    .container {
        padding: 28px 22px;
    }

    .logo h1 {
        font-size: 24px;
    }

}

</style></head><body><!-- ================= BACKGROUND ================= --><div class="background"><div class="orb one"></div>

<div class="orb two"></div>

</div><!-- ================= LOGIN CARD ================= --><div class="container"><!-- ================= LOGO ================= -->

<div class="logo">

    <div class="logo-icon">
        S
    </div>

    <h1>
        Skill<span>Sync</span> AI
    </h1>

    <p>
        Your career, synced with the market.
    </p>

</div>


<!-- =================================================
     LOGIN
================================================== -->

<div id="loginBox">

    <h2>
        Welcome back 👋
    </h2>


    <div class="form-group">

        <label for="loginEmail">
            Email
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
        >

    </div>


    <div class="form-group">

        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

    </div>


    <button
        type="button"
        onclick="login()"
    >
        Enter SkillSync →
    </button>


    <div class="switch">

        Don't have an account?

        <span onclick="showSignup()">
            Create account
        </span>

    </div>

</div>


<!-- =================================================
     SIGNUP
================================================== -->

<div
    id="signupBox"
    class="hidden"
>

    <h2>
        Create your profile ✨
    </h2>


    <div class="form-group">

        <label for="signupName">
            Full Name
        </label>

        <input
            id="signupName"
            type="text"
            placeholder="Your name"
            autocomplete="name"
        >

    </div>


    <div class="form-group">

        <label for="signupEmail">
            Email
        </label>

        <input
            id="signupEmail"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
        >

    </div>


    <div class="form-group">

        <label for="signupPassword">
            Password
        </label>

        <input
            id="signupPassword"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
        >

    </div>


    <button
        type="button"
        onclick="signup()"
    >
        Create Account →
    </button>


    <div class="switch">

        Already have an account?

        <span onclick="showLogin()">
            Login
        </span>

    </div>

</div>


<!-- ================= USER PREVIEW ================= -->

<div
    id="userPreview"
    class="user-preview"
></div>


<!-- ================= MESSAGE ================= -->

<div
    id="message"
    class="message"
></div>


<!-- ================= DEMO NOTE ================= -->

<div class="demo-note">

    SkillSync AI · Live Skill Intelligence

</div>

</div><script>


/* =====================================================
   ELEMENTS
===================================================== */

const message =
    document.getElementById("message");

const userPreview =
    document.getElementById("userPreview");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    success = false
) {

    message.textContent = text;

    message.style.color =
        success
            ? "#20d9c5"
            : "#ff7994";

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin() {

    document
        .getElementById("signupBox")
        .classList.add("hidden");

    document
        .getElementById("loginBox")
        .classList.remove("hidden");

    userPreview.style.display = "none";

    message.textContent = "";

}


/* =====================================================
   SHOW SIGNUP
===================================================== */

function showSignup() {

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("signupBox")
        .classList.remove("hidden");

    userPreview.style.display = "none";

    message.textContent = "";

}


/* =====================================================
   EMAIL VALIDATION
===================================================== */

function isValidEmail(email) {

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

}


/* =====================================================
   GET NAME FROM EMAIL
===================================================== */

function getNameFromEmail(email) {

    const username =
        email
            .split("@")[0]
            .replace(/[._-]+/g, " ")
            .trim();

    if (!username) {
        return "User";
    }

    return username
        .split(" ")
        .map(
            word =>
                word.charAt(0).toUpperCase() +
                word.slice(1)
        )
        .join(" ");

}


/* =====================================================
   SIGNUP
===================================================== */

function signup() {

    const name =
        document
            .getElementById("signupName")
            .value
            .trim();

    const email =
        document
            .getElementById("signupEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("signupPassword")
            .value;


    /* Validation */

    if (!name || !email || !password) {

        showMessage(
            "Please fill in all fields."
        );

        return;

    }


    if (!isValidEmail(email)) {

        showMessage(
            "Please enter a valid email address."
        );

        return;

    }


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters."
        );

        return;

    }


    /*
       Demo account storage.

       IMPORTANT:
       This is only for a prototype.
       Do not use localStorage for real passwords
       in a production application.
    */

    const account = {

        name: name,

        email: email,

        password: password

    };


    localStorage.setItem(
        "skillsyncAccount",
        JSON.stringify(account)
    );


    /* Show login page */

    showLogin();


    document
        .getElementById("loginEmail")
        .value = email;


    showMessage(
        "Account created successfully ✓",
        true
    );

}


/* =====================================================
   LOGIN
===================================================== */

function login() {

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    /* Validation */

    if (!email || !password) {

        showMessage(
            "Please enter your email and password."
        );

        return;

    }


    if (!isValidEmail(email)) {

        showMessage(
            "Please enter a valid email address."
        );

        return;

    }


    /*
       Check demo account.
    */

    const savedAccount =
        localStorage.getItem(
            "skillsyncAccount"
        );


    if (savedAccount) {

        try {

            const account =
                JSON.parse(savedAccount);


            if (
                account.email === email &&
                account.password === password
            ) {

                enterDashboard(
                    account.name
                );

                return;

            }


            showMessage(
                "Incorrect email or password."
            );

            return;

        }

        catch {

            localStorage.removeItem(
                "skillsyncAccount"
            );

        }

    }


    /*
       If there is no saved account,
       allow demo login.
    */

    enterDashboard(
        getNameFromEmail(email)
    );

}


/* =====================================================
   ENTER DASHBOARD
===================================================== */

function enterDashboard(name) {

    showMessage(
        `Welcome ${name} ✓`,
        true
    );


    localStorage.setItem(
        "skillsyncLoggedIn",
        "true"
    );

    localStorage.setItem(
        "skillsyncUserName",
        name
    );


    /*
       Small delay so the user sees
       the successful login message.
    */

    setTimeout(() => {

        window.location.href =
            "/index.html";

    }, 700);

}


/* =====================================================
   ENTER KEY SUPPORT
===================================================== */

document
    .getElementById("loginPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );


document
    .getElementById("loginEmail")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );


document
    .getElementById("signupPassword")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                signup();

            }

        }
    );


</script></body>
</html>
